<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counting Corn - Customer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <header class="bg-amber-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 p-2 rounded-lg text-amber-950 font-bold"><i data-lucide="wheat" class="w-6 h-6"></i></div>
        <div>
          <h1 class="font-bold text-xl">Counting Corn</h1>
          <p id="user-role-badge" class="text-xs text-amber-100">Role: Customer</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleCartModal(true)" class="bg-amber-700 hover:bg-amber-800 text-white px-3.5 py-2 rounded-xl flex items-center gap-2 text-sm font-semibold">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i> Cart <span id="cart-count" class="bg-white text-amber-900 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <button onclick="CountingCornApp.logout()" class="bg-amber-800 hover:bg-amber-900 text-amber-100 px-3 py-2 rounded-xl text-xs font-semibold">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
    <h2 class="text-2xl font-bold text-slate-900">Fresh Corn Catalog</h2>
    <div id="customer-catalog" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>

    <div class="bg-white rounded-2xl border p-6 shadow-sm mt-8">
      <h3 class="text-lg font-bold mb-4">Your Orders & Receipts</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 border-b">
            <tr>
              <th class="p-3">Order ID</th>
              <th class="p-3">Items</th>
              <th class="p-3">Total</th>
              <th class="p-3">Status</th>
              <th class="p-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="customer-orders-table"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="cart-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl p-6 flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex justify-between items-center border-b pb-4">
          <h3 class="text-lg font-bold">Your Order Cart</h3>
          <button onclick="toggleCartModal(false)" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div id="cart-items" class="py-4 divide-y"></div>
      </div>

      <div class="border-t pt-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pin Delivery Location (Click or Drag Pin)</label>
          <div id="delivery-map" class="border border-slate-300"></div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Address Landmark</label>
          <input type="text" id="cust-address-input" class="w-full border rounded-xl p-2.5 text-sm" placeholder="e.g. Xavier University, CDO">
        </div>
        <div class="flex justify-between font-bold text-base">
          <span>Calculated Total:</span>
          <span id="cart-total-price">₱0.00</span>
        </div>
        <button onclick="submitOrder()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl">Confirm & Place Order</button>
      </div>
    </div>
  </div>

  <div id="cancel-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-lg text-red-700">Cancel Order</h3>
        <button onclick="closeCancelModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <p class="text-xs text-slate-500">Please tell us why you are cancelling this order:</p>
      <form onsubmit="confirmCancelOrder(event)" class="space-y-3">
        <div class="space-y-2 text-sm">
          <label class="flex items-center gap-2 p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50">
            <input type="radio" name="cancel-reason" value="Changed my mind" required onchange="toggleOtherCancelInput(false)">
            <span>Changed my mind</span>
          </label>
          <label class="flex items-center gap-2 p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50">
            <input type="radio" name="cancel-reason" value="Ordered by mistake" onchange="toggleOtherCancelInput(false)">
            <span>Ordered by mistake</span>
          </label>
          <label class="flex items-center gap-2 p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50">
            <input type="radio" name="cancel-reason" value="Need to modify order items or address" onchange="toggleOtherCancelInput(false)">
            <span>Need to modify order items or address</span>
          </label>
          <label class="flex items-center gap-2 p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50">
            <input type="radio" name="cancel-reason" value="Delivery taking too long" onchange="toggleOtherCancelInput(false)">
            <span>Delivery taking too long</span>
          </label>
          <label class="flex items-center gap-2 p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50">
            <input type="radio" name="cancel-reason" value="Found a better price elsewhere" onchange="toggleOtherCancelInput(false)">
            <span>Found a better price elsewhere</span>
          </label>
          <label class="flex items-center gap-2 p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50">
            <input type="radio" name="cancel-reason" value="Other" onchange="toggleOtherCancelInput(true)">
            <span>Other reason</span>
          </label>
        </div>
        <input type="text" id="cancel-other-text" class="hidden w-full border rounded-xl p-2.5 text-sm" placeholder="Please specify your reason...">
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeCancelModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-sm font-semibold">Keep Order</button>
          <button type="submit" class="w-1/2 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl text-sm font-semibold">Confirm Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="receipt-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 font-mono text-sm">
      <div class="text-center border-b pb-3">
        <h3 class="font-bold text-lg">COUNTING CORN</h3>
        <p class="text-xs text-slate-500">Official Transaction Receipt</p>
      </div>
      <div id="receipt-content" class="space-y-2 text-xs"></div>
      <button onclick="document.getElementById('receipt-modal').classList.add('hidden')" class="w-full bg-slate-900 text-white py-2.5 rounded-xl font-sans font-semibold">Close Receipt</button>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl"><span id="toast-msg">Notification</span></div>

  <script src="app.js"></script>
  <script>
    const user = CountingCornApp.requireAuth('Customer');
    document.getElementById('user-role-badge').innerText = `Logged in as: ${user.name} (${user.role})`;

    let catalogData = [];
    let ordersData = [];
    let cart = [];
    let orderToCancelId = null;
    let selectedCoords = { lat: 8.4772, lng: 124.6459 };
    let customerMap, customerMarker;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadPortalData();
    });

    async function loadPortalData() {
      const data = await CountingCornApp.fetchState();
      catalogData = data.catalog;
      ordersData = data.orders;

      document.getElementById('customer-catalog').innerHTML = catalogData.map(p => `
        <div class="bg-white rounded-2xl border p-5 shadow-sm flex flex-col justify-between">
          <div>
            <div class="text-4xl mb-3">${p.img}</div>
            <h3 class="font-bold text-lg">${p.name}</h3>
            <p class="text-amber-600 font-extrabold text-xl mt-1">₱${p.currentPrice.toFixed(2)} <span class="text-xs text-slate-400 font-normal">/ ${p.unit}</span></p>
            <div class="mt-2 text-xs font-semibold ${p.availableStock > 0 ? 'text-emerald-600' : 'text-red-500'}">
              ${p.availableStock > 0 ? `Available: ${p.availableStock} ${p.unit}` : 'Out of Stock'}
            </div>
          </div>
          <button onclick="addToCart('${p._id}')" ${p.availableStock === 0 ? 'disabled' : ''} class="mt-4 w-full bg-slate-900 hover:bg-amber-600 text-white font-medium py-2.5 rounded-xl text-sm disabled:bg-slate-300">
            Add to Order
          </button>
        </div>
      `).join('');

      document.getElementById('customer-orders-table').innerHTML = ordersData.map(o => `
        <tr class="border-b">
          <td class="p-3 font-bold">${o.orderId}</td>
          <td class="p-3 text-xs">${o.items.map(i => `${i.name} (${i.qty}kg)`).join(', ')}</td>
          <td class="p-3 font-bold">₱${o.totalAmount.toFixed(2)}</td>
          <td class="p-3">
            <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${CountingCornApp.getBadgeClass(o.status)}">${o.status}</span>
            ${o.status === 'Cancelled' && o.cancelReason ? `<div class="text-[11px] text-red-600 mt-1">${o.cancelReason}</div>` : ''}
          </td>
          <td class="p-3 text-right space-x-1">
            <button onclick="viewReceipt('${o._id}')" class="text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-lg font-semibold">View Receipt</button>
            ${(o.status === 'Pending' || o.status === 'Processing') ? `
              <button onclick="openCancelModal('${o._id}')" class="text-xs bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1 rounded-lg font-semibold">Cancel</button>
            ` : ''}
          </td>
        </tr>
      `).join('');
    }

    function openCancelModal(orderId) {
      orderToCancelId = orderId;
      document.querySelectorAll('input[name="cancel-reason"]').forEach(r => r.checked = false);
      const otherInput = document.getElementById('cancel-other-text');
      otherInput.value = '';
      otherInput.classList.add('hidden');
      document.getElementById('cancel-modal').classList.remove('hidden');
    }

    function closeCancelModal() {
      orderToCancelId = null;
      document.getElementById('cancel-modal').classList.add('hidden');
    }

    function toggleOtherCancelInput(show) {
      const otherInput = document.getElementById('cancel-other-text');
      if (show) {
        otherInput.classList.remove('hidden');
        otherInput.required = true;
      } else {
        otherInput.classList.add('hidden');
        otherInput.required = false;
      }
    }

    async function confirmCancelOrder(e) {
      e.preventDefault();
      if (!orderToCancelId) return;
      const selectedRadio = document.querySelector('input[name="cancel-reason"]:checked');
      if (!selectedRadio) return;

      let reason = selectedRadio.value;
      if (reason === 'Other') {
        reason = document.getElementById('cancel-other-text').value.trim() || 'Other';
      }

      const res = await fetch(`/api/orders/${orderToCancelId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'Cancelled', cancelReason: reason })
      });

      if (res.ok) {
        closeCancelModal();
        await loadPortalData();
        CountingCornApp.showToast('Order cancelled and feedback recorded.');
      } else {
        alert('This order can no longer be cancelled.');
      }
    }

    function addToCart(id) {
      const product = catalogData.find(p => p._id === id);
      const existing = cart.find(c => c.cornTypeId === id);
      if (existing) {
        if (existing.qty < product.availableStock) existing.qty++;
      } else {
        cart.push({ cornTypeId: product._id, name: product.name, price: product.currentPrice, qty: 1, max: product.availableStock });
      }
      updateCartUI();
      CountingCornApp.showToast(`Added ${product.name} to cart.`);
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.reduce((sum, i) => sum + i.qty, 0);
      document.getElementById('cart-items').innerHTML = cart.length === 0 
        ? `<p class="text-slate-400 text-sm text-center py-6">Your cart is empty.</p>` 
        : cart.map(i => `
          <div class="py-3 flex justify-between items-center">
            <div>
              <p class="font-bold text-sm">${i.name}</p>
              <p class="text-xs text-slate-500">₱${i.price} x ${i.qty} kg = ₱${(i.price * i.qty).toFixed(2)}</p>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="changeQty('${i.cornTypeId}', -1)" class="w-6 h-6 border rounded">-</button>
              <span class="text-sm font-semibold">${i.qty}</span>
              <button onclick="changeQty('${i.cornTypeId}', 1)" class="w-6 h-6 border rounded">+</button>
            </div>
          </div>
        `).join('');

      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('cart-total-price').innerText = `₱${total.toFixed(2)}`;
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.cornTypeId === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty > item.max) item.qty = item.max;
      if (item.qty <= 0) cart = cart.filter(i => i.cornTypeId !== id);
      updateCartUI();
    }

    function toggleCartModal(show) {
      const modal = document.getElementById('cart-modal');
      if (show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          if (!customerMap) {
            customerMap = L.map('delivery-map').setView([selectedCoords.lat, selectedCoords.lng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '&copy; OpenStreetMap contributors'
            }).addTo(customerMap);
            customerMarker = L.marker([selectedCoords.lat, selectedCoords.lng], { draggable: true }).addTo(customerMap);

            customerMap.on('click', (e) => {
              customerMarker.setLatLng(e.latlng);
              selectedCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
            });

            customerMarker.on('dragend', () => {
              const pos = customerMarker.getLatLng();
              selectedCoords = { lat: pos.lat, lng: pos.lng };
            });
          }
          customerMap.invalidateSize();
        }, 250);
      } else {
        modal.classList.add('hidden');
      }
    }

    async function submitOrder() {
      if (cart.length === 0) return alert('Your cart is empty!');
      const address = document.getElementById('cust-address-input').value.trim() || 'Cagayan de Oro City';

      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customerName: user.name,
          items: cart,
          address,
          lat: selectedCoords.lat,
          lng: selectedCoords.lng
        })
      });

      const createdOrder = await res.json();
      cart = [];
      updateCartUI();
      toggleCartModal(false);
      await loadPortalData();
      showReceiptModal(createdOrder);
    }

    function viewReceipt(orderId) {
      const order = ordersData.find(o => o._id === orderId);
      if (order) showReceiptModal(order);
    }

    function showReceiptModal(o) {
      document.getElementById('receipt-content').innerHTML = `
        <p><b>Receipt #:</b> ${o.receiptNumber}</p>
        <p><b>Order ID:</b> ${o.orderId}</p>
        <p><b>Customer:</b> ${o.customerName}</p>
        <p><b>Date:</b> ${new Date(o.createdAt).toLocaleString()}</p>
        <p><b>Status:</b> ${o.status} (${o.paymentStatus})</p>
        ${o.status === 'Cancelled' && o.cancelReason ? `<p class="text-red-600"><b>Cancel Reason:</b> ${o.cancelReason}</p>` : ''}
        <hr class="my-2">
        ${o.items.map(i => `<div class="flex justify-between"><span>${i.name} (${i.qty}kg @ ₱${i.price})</span><span>₱${i.subtotal.toFixed(2)}</span></div>`).join('')}
        <hr class="my-2">
        <div class="flex justify-between font-bold text-sm"><span>TOTAL:</span><span>₱${o.totalAmount.toFixed(2)}</span></div>
      `;
      document.getElementById('receipt-modal').classList.remove('hidden');
    }
  </script>
</body>
</html>
