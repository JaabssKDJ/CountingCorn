<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counting Corn - Login Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white text-slate-800 rounded-3xl shadow-2xl max-w-md w-full p-8">
    <div class="text-center mb-6">
      <div class="inline-flex p-3 bg-amber-100 text-amber-600 rounded-2xl mb-3">
        <i data-lucide="wheat" class="w-10 h-10"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Counting Corn</h1>
      <p class="text-xs text-slate-500 mt-1">Select your User Role to log in</p>
    </div>

    <div class="grid grid-cols-3 gap-1.5 p-1.5 bg-slate-100 rounded-2xl mb-6 text-xs font-semibold">
      <button type="button" onclick="selectRole('Customer')" id="tab-Customer" class="role-tab-btn py-2.5 rounded-xl bg-amber-600 text-white shadow">Customer</button>
      <button type="button" onclick="selectRole('Staff')" id="tab-Staff" class="role-tab-btn py-2.5 rounded-xl text-slate-600">Staff</button>
      <button type="button" onclick="selectRole('Admin')" id="tab-Admin" class="role-tab-btn py-2.5 rounded-xl text-slate-600">Admin</button>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">Username</label>
        <input type="text" id="login-username" value="customer" required class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1 uppercase">Password</label>
        <input type="password" id="login-password" value="123" required class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm">
        <p class="text-[11px] text-slate-400 mt-1">Default demo password for all roles: <b>123</b></p>
      </div>

      <div id="login-error" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-xl border border-red-200">
        Invalid credentials for selected role.
      </div>

      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl shadow-lg text-sm">
        Enter Portal
      </button>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    let activeRole = 'Customer';

    function selectRole(role) {
      activeRole = role;
      document.querySelectorAll('.role-tab-btn').forEach(btn => {
        btn.classList.remove('bg-amber-600', 'text-white', 'shadow');
        btn.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById(`tab-${role}`);
      activeBtn.classList.add('bg-amber-600', 'text-white', 'shadow');
      activeBtn.classList.remove('text-slate-600');
      document.getElementById('login-username').value = role.toLowerCase();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, role: activeRole })
      });

      if (res.ok) {
        const user = await res.json();
        CountingCornApp.setSession(user);
        redirectByRole(user.role);
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    function redirectByRole(role) {
      if (role === 'Admin') window.location.href = 'admin.html';
      else if (role === 'Staff') window.location.href = 'delivery.html';
      else window.location.href = 'customer.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const session = CountingCornApp.getSession();
      if (session) redirectByRole(session.role);
    });
  </script>
</body>
</html>
