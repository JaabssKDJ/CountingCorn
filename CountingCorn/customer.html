<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counting Corn - Customer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header Navigation -->
  <header class="bg-amber-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 p-2 rounded-lg text-amber-950 font-bold shadow-sm">
          <i data-lucide="wheat" class="w-6 h-6 inline-block"></i>
        </div>
        <div>
          <h1 class="font-bold text-xl leading-tight">Counting Corn</h1>
          <p class="text-xs text-amber-100">Customer Fresh Order Portal</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="toggleCartModal(true)" class="relative bg-amber-700 hover:bg-amber-800 text-white px-3.5 py-2 rounded-xl flex items-center gap-2 text-sm font-semibold transition shadow-sm">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Cart</span>
          <span id="cart-count" class="bg-white text-amber-900 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <button onclick="CountingCornApp.logout()" title="Logout" class="bg-amber-800 hover:bg-amber-900 text-amber-100 px-3 py-2 rounded-xl transition text-xs font-semibold flex items-center gap-1">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
    <div class="flex justify-between items-center border-b pb-4">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">Corn Catalog</h2>
        <p class="text-slate-500 text-sm">Fresh agricultural produce directly from our farm.</p>
      </div>
    </div>

    <!-- Product Catalog Grid -->
    <div id="customer-catalog" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Injected via JS -->
    </div>

    <!-- Order Tracking Table -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm mt-8">
      <h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-900">
        <i data-lucide="package-search" class="w-5 h-5 text-amber-600"></i> Track Your Orders
      </h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 border-b">
            <tr>
              <th class="p-3">Order ID</th>
              <th class="p-3">Items</th>
              <th class="p-3">Total Cost</th>
              <th class="p-3">Delivery Address</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="customer-orders-table">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Cart Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl p-6 flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex justify-between items-center border-b pb-4">
          <h3 class="text-lg font-bold text-slate-900">Your Order Cart</h3>
          <button onclick="toggleCartModal(false)" class="text-slate-400 hover:text-slate-600 transition">
            <i data-lucide="x" class="w-6 h-6"></i>
          </button>
        </div>

        <div id="cart-items" class="py-4 divide-y divide-slate-100">
          <!-- Injected via JS -->
        </div>
      </div>

      <div class="border-t pt-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Set Delivery Pin (Click Map)</label>
          <div id="delivery-map"></div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Delivery Address Landmark / Notes</label>
          <input type="text" id="cust-address-input" class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="e.g. Near Xavier Univ Gym, CDO">
        </div>

        <div class="flex justify-between font-bold text-slate-900 text-base">
          <span>Total:</span>
          <span id="cart-total-price">₱0.00</span>
        </div>

        <button onclick="submitOrder()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">
          Confirm & Place Order
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
    <i data-lucide="bell" class="w-5 h-5 text-amber-400"></i>
    <span id="toast-msg">Notification</span>
  </div>

  <script src="app.js"></script>
  <script>
    CountingCornApp.requireAuth('customer');

    let cart = [];
    let selectedCoords = { lat: 8.4772, lng: 124.6459 };
    let customerMap, customerMarker;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderCatalog();
      renderCustomerOrders();
    });

    function renderCatalog() {
      const state = CountingCornApp.getState();
      const container = document.getElementById('customer-catalog');
      container.innerHTML = state.products.map(p => `
        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between">
          <div>
            <div class="text-4xl mb-3">${p.img}</div>
            <h3 class="font-bold text-slate-900 text-lg">${p.name}</h3>
            <p class="text-amber-600 font-extrabold text-xl mt-1">₱${p.price.toFixed(2)} <span class="text-xs text-slate-400 font-normal">/ ${p.unit}</span></p>
            <div class="mt-2 text-xs font-semibold ${p.stock > 50 ? 'text-emerald-600' : 'text-red-500'}">
              ${p.stock > 0 ? `In Stock: ${p.stock} ${p.unit}` : 'Out of Stock'}
            </div>
          </div>
          <button onclick="addToCart('${p.id}')" ${p.stock === 0 ? 'disabled' : ''} class="mt-4 w-full bg-slate-900 hover:bg-amber-600 text-white font-medium py-2.5 rounded-xl text-sm transition disabled:bg-slate-300">
            Add to Order
          </button>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const state = CountingCornApp.getState();
      const product = state.products.find(p => p.id === productId);
      const existing = cart.find(c => c.id === productId);

      if (existing) {
        if (existing.qty < product.stock) existing.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
      CountingCornApp.showToast(`Added ${product.name} to cart.`);
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.reduce((sum, i) => sum + i.qty, 0);
      const itemsContainer = document.getElementById('cart-items');

      itemsContainer.innerHTML = cart.length === 0 
        ? `<p class="text-slate-400 text-sm text-center py-6">Your cart is empty.</p>` 
        : cart.map(i => `
          <div class="py-3 flex justify-between items-center">
            <div>
              <p class="font-bold text-sm text-slate-800">${i.name}</p>
              <p class="text-xs text-slate-500">₱${i.price} x ${i.qty}</p>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="changeCartQty('${i.id}', -1)" class="w-6 h-6 border rounded-lg hover:bg-slate-100">-</button>
              <span class="text-sm font-semibold">${i.qty}</span>
              <button onclick="changeCartQty('${i.id}', 1)" class="w-6 h-6 border rounded-lg hover:bg-slate-100">+</button>
            </div>
          </div>
        `).join('');

      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('cart-total-price').innerText = `₱${total.toFixed(2)}`;
    }

    function changeCartQty(id, delta) {
      const state = CountingCornApp.getState();
      const item = cart.find(i => i.id === id);
      const product = state.products.find(p => p.id === id);
      if (!item) return;

      item.qty += delta;
      if (item.qty > product.stock) item.qty = product.stock;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }

    function toggleCartModal(show) {
      const modal = document.getElementById('cart-modal');
      if (show) {
        modal.classList.remove('hidden');
        setTimeout(initCustomerMap, 200);
      } else {
        modal.classList.add('hidden');
      }
    }

    function initCustomerMap() {
      if (customerMap) return;
      customerMap = L.map('delivery-map').setView([8.4772, 124.6459], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(customerMap);
      customerMarker = L.marker([8.4772, 124.6459], { draggable: true }).addTo(customerMap);

      customerMap.on('click', (e) => {
        customerMarker.setLatLng(e.latlng);
        selectedCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
      });
    }

    function submitOrder() {
      if (cart.length === 0) return alert('Your cart is empty!');
      const address = document.getElementById('cust-address-input').value.trim() || 'Xavier University Campus, CDO';
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const state = CountingCornApp.getState();
      const newOrder = {
        id: `ORD-${1000 + state.orders.length + 1}`,
        customer: 'Customer User',
        items: [...cart],
        total: total,
        address: address,
        status: 'Pending',
        lat: selectedCoords.lat,
        lng: selectedCoords.lng
      };

      // Deduct Stock
      cart.forEach(c => {
        const prod = state.products.find(p => p.id === c.id);
        if (prod) prod.stock -= c.qty;
      });

      state.orders.unshift(newOrder);
      CountingCornApp.setState(state);

      cart = [];
      updateCartUI();
      toggleCartModal(false);
      renderCatalog();
      renderCustomerOrders();
      CountingCornApp.showToast('Order successfully placed!');
    }

    function renderCustomerOrders() {
      const state = CountingCornApp.getState();
      const container = document.getElementById('customer-orders-table');
      container.innerHTML = state.orders.map(o => `
        <tr class="border-b">
          <td class="p-3 font-semibold">${o.id}</td>
          <td class="p-3">${o.items.map(i => `${i.name} (${i.qty})`).join(', ')}</td>
          <td class="p-3 font-bold">₱${o.total.toFixed(2)}</td>
          <td class="p-3 text-slate-500">${o.address}</td>
          <td class="p-3"><span class="px-2.5 py-1 text-xs font-semibold rounded-full ${CountingCornApp.getBadgeClass(o.status)}">${o.status}</span></td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
